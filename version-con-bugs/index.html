<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro - Actividad de Depuración</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Registro de Usuario</h1>
        <p class="subtitle">Actividad Práctica: Ciclo Completo de Depuración</p>

        <form id="registrationForm">
            <div class="form-group">
                <label for="fullName">Nombre Completo *</label>
                <input type="text" id="fullName" name="fullName" required>
                <span class="error-message" id="nameError"></span>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico *</label>
                <input type="text" id="email" name="email" required>
                <span class="error-message" id="emailError"></span>
            </div>

            <div class="form-group">
                <label for="birthdate">Fecha de Nacimiento *</label>
                <input type="date" id="birthdate" name="birthdate" required>
                <span class="error-message" id="birthdateError"></span>
            </div>

            <div class="form-group">
                <label for="password">Contraseña *</label>
                <input type="password" id="password" name="password" required>
                <span class="error-message" id="passwordError"></span>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar Contraseña *</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
                <span class="error-message" id="confirmPasswordError"></span>
            </div>

            <div class="form-group">
                <label for="phone">Teléfono</label>
                <input type="tel" id="phone" name="phone" placeholder="Ej: +34 123456789">
                <span class="error-message" id="phoneError"></span>
            </div>

            <button type="submit" class="submit-btn">Registrarse</button>
        </form>

        <div id="successMessage" class="success-message" style="display: none;">
            <h2>¡Registro Exitoso!</h2>
            <p>Datos registrados:</p>
            <div id="userData"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
